name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: environment
        required: true
  push:
    branches:
      - "*_dev"
      - "*_qa"

env:
  TZ: America/New_York

jobs:
  Deploy:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    environment: ${{ (endsWith(github.ref, '_dev') && 'dev') || (endsWith(github.ref, '_qa') && 'qa') || inputs.environment || '' }}

    steps:
      - uses: "actions/checkout@v4"

      - name: "Set app version"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            TIMESTAMP=$(date -u +"%Y%m%d")
            REF_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '--' | tr -cd '[:alnum:]_.-')
            echo "APP_VERSION=${REF_SLUG}_${TIMESTAMP}" >> "$GITHUB_ENV"
          fi

      # Set up Google Cloud SDK
      - name: "Set up Google Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - id: "generate_app_yaml"
        name: "Generate app.yaml"
        run: envsubst < app.template.yaml > app.yaml
        env:
          VPC: ${{ secrets.VPC }}
          SUBNET: ${{ secrets.SUBNET }}
          APP_VERSION: ${{ env.APP_VERSION }}

      - id: deploy
        name: "Deploy App"
        run: gcloud app deploy app.yaml --project ${{ secrets.PROJECT_ID }} --promote --verbosity debug --service-account=${{ secrets.APP_SERVICE_ACCOUNT }}

